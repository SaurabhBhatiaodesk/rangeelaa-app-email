client_id = "2051a327000a096d9e4fbeebd27308d9"
name = "Rangeela Shipping Manager"
handle = "rangeelaa-shipping-manager"
application_url = "https://rangeelaa-thursday-emails-18ca86a014f2.herokuapp.com"
embedded = true

[access_scopes]
scopes = "read_orders,write_orders,write_draft_orders,read_draft_orders,read_customers,read_products,write_products,write_metaobjects,write_metaobject_definitions"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"
access.admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"
access.admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

[[webhooks.subscriptions]]
uri = "/webhooks/orders/updated"
topics = ["orders/updated"]

[auth]
redirect_urls = [
  "https://rangeelaa-thursday-emails-18ca86a014f2.herokuapp.com/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
